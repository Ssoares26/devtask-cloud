<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTask Cloud - Gerenciador de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>DevTask Cloud</h1>
            <p class="subtitle">Gerenciador de tarefas moderno</p>
        </header>

        <main>
            <form id="task-form">
                <input type="text" id="task-input" placeholder="Digite uma nova tarefa..." required>
                <button type="submit">Adicionar</button>
            </form>

            <div class="filters">
                <button class="filter-btn active" data-filter="all">Todas</button>
                <button class="filter-btn" data-filter="pending">Pendentes</button>
                <button class="filter-btn" data-filter="completed">Concluídas</button>
            </div>

            <ul id="task-list" class="task-list"></ul>

            <div class="task-counter">
                <span id="counter-text">0 tarefas</span>
            </div>
        </main>

        <footer>
            <p>Versão v1.0 — Deploy via CI/CD</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
